[package]
name = "bincode-fuzz"
version = "3.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2024"
rust-version = "1.93.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde = { version = "1.0", features = ["derive"] }

[dependencies.bincode]
path = ".."

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false

[[bin]]
name = "compat"
path = "fuzz_targets/compat.rs"
test = false
doc = false
