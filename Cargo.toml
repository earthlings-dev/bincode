[workspace]
members = ["derive", "compatibility"]

[workspace.package]
version = "4.0.0"
authors = [
    "Ty Overby <ty@pre-alpha.com>",
    "Zoey Riordan <zoey@dos.cafe>",
    "Victor Koenders <bincode@trangar.com>",
    "Takumi Shimada <hello@takumi.earth>",
]
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/bincode-org/bincode"
documentation = "https://docs.rs/bincode"

[package]
name = "bincode"
version.workspace = true
authors.workspace = true
exclude = ["logo.svg", "examples/*", ".gitignore", ".github/"]
rust-version.workspace = true

publish = true

repository.workspace = true
documentation.workspace = true
readme = "./README.md"
categories = ["encoding", "network-programming"]
keywords = ["binary", "encode", "decode", "serialize", "deserialize"]

license.workspace = true
description = "A binary serialization / deserialization strategy for transforming structs into bytes and vice versa!"

edition.workspace = true

[features]
default = ["std", "derive", "serde"]
std = ["alloc", "serde?/std"]
alloc = ["serde?/alloc"]
derive = ["bincode_derive"]

[workspace.dependencies]
bincode = { path = ".", version = "4.0.0" }
bincode_derive = { path = "derive", version = "4.0.0" }
serde = { version = "1.0", default-features = false }
serde_derive = "1.0"
rand = "0.10"
criterion = "0.8"
unty = "0.0.5"
virtue = "0.0.19"
template-core = { version = "0.3.0", git = "https://github.com/earthlings-dev/template-rs.git", branch = "main"}
template-stask = { version = "0.3.0", git = "https://github.com/earthlings-dev/template-rs.git", branch = "main"}

[dependencies]
bincode_derive = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
unty = { workspace = true }

# Used for tests
[dev-dependencies]
ouroboros = "0.18.5"
serde_derive = { workspace = true }
serde_json = { version = "1.0", default-features = false }
tempfile = "3.27"
criterion = { workspace = true }
rand = { workspace = true }
uuid = { version = "1.24", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
glam = { version = "0.33", features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
bumpalo = { version = "3.20.3", features = ["collections"] }

[[bench]]
name = "varint"
harness = false

[[bench]]
name = "inline"
harness = false

[[bench]]
name = "string"
harness = false

[profile.bench]
codegen-units = 1
debug = 1
lto = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
