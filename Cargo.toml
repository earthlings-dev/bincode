[workspace]
members = ["derive", "compatibility"]

[package]
name = "bincode"
version = "3.0.0"
authors = [
    "Ty Overby <ty@pre-alpha.com>",
    "Zoey Riordan <zoey@dos.cafe>",
    "Victor Koenders <bincode@trangar.com>",
]
exclude = ["logo.svg", "examples/*", ".gitignore", ".github/"]
rust-version = "1.93.0"

publish = true

repository = "https://github.com/bincode-org/bincode"
documentation = "https://docs.rs/bincode"
readme = "./readme.md"
categories = ["encoding", "network-programming"]
keywords = ["binary", "encode", "decode", "serialize", "deserialize"]

license = "MIT"
description = "A binary serialization / deserialization strategy for transforming structs into bytes and vice versa!"

edition = "2024"

[features]
default = ["std", "derive", "serde"]
std = ["alloc", "serde?/std"]
alloc = ["serde?/alloc"]
derive = ["bincode_derive"]

[workspace.dependencies]
bincode_derive = { path = "derive", version = "3.0.0" }
serde = { version = "1.0", default-features = false }
serde_derive = "1.0"
rand = "0.10"
criterion = "0.8"
unty = "0.0.5"
virtue = "0.0.19"

[dependencies]
bincode_derive = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
unty = { workspace = true }

# Used for tests
[dev-dependencies]
ouroboros = "0.18.5"
serde_derive = { workspace = true }
serde_json = { version = "1.0", default-features = false }
tempfile = "3.25"
criterion = { workspace = true }
rand = { workspace = true }
uuid = { version = "1.20", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
glam = { version = "0.32", features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
bumpalo = { version = "3.19.1", features = ["collections"] }

[[bench]]
name = "varint"
harness = false

[[bench]]
name = "inline"
harness = false

[[bench]]
name = "string"
harness = false

[profile.bench]
codegen-units = 1
debug = 1
lto = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
